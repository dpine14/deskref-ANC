[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskref-ANC"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyserial",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
    "soundfile",
    "sounddevice",
]

[tool.setuptools.packages.find]
include = ["deskref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]